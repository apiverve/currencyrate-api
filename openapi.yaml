openapi: 3.0.4
info:
  title: Currency Rate
  description: >-
    Currency Rate returns one currency's live value in US dollars or any other
    base, across 170+ currencies, with its name, symbol and direction since
    yesterday. Paid plans add any base currency, 1-day to 1-year changes,
    24-hour and 30-day highs and lows, and hourly and 30-day daily history.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/currencyrate:
    get:
      summary: Currency Rate
      description: >-
        Get one currency's live value in US dollars or another base, with its
        recent changes and history on paid plans.
      operationId: currencyrate
      parameters:
        - name: currency
          in: query
          schema:
            type: string
          required: true
          description: The ISO 4217 code of the currency to price (e.g. EUR)
          example: EUR
        - name: base
          in: query
          schema:
            type: string
          required: false
          description: The currency to price it in; defaults to USD
          example: USD
        - name: hourly
          in: query
          schema:
            type: boolean
          required: false
          description: Include the price for each of the last 24 hours
          example: true
        - name: daily
          in: query
          schema:
            type: boolean
          required: false
          description: Include the daily closing price for the last 30 days
          example: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
